[package]
name = "octoneo-desktop"
description = "OctoNeo desktop app: a thin Tauri shell over octoneo-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's, which
# Windows needs (https://github.com/rust-lang/cargo/issues/8519).
name = "octoneo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "octoneo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4"
octoneo-core = { path = "../crates/octoneo-core" }
reqwest = { version = "0.13", features = ["json", "gzip"] }
semver = "1"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
