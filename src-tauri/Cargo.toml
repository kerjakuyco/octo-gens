[package]
name = "octogens-desktop"
description = "Octo Gens desktop app: a thin Tauri shell over octogens-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's, which
# Windows needs (https://github.com/rust-lang/cargo/issues/8519).
name = "octogens_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "octo-gens"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = "4"
octogens-core = { path = "../crates/octogens-core" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio.workspace = true
