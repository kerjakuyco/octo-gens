<!doctype html>
<!--
  The picture shown when a link to the site is shared (1200 x 630), in the site's monochrome look: near-black,
  white type at medium weight, a few greys, hairlines, no glow. On the left the bare white octopus and the name,
  the headline, one grey line and the address; on the right a slice of the app, the order ticket the assistant
  drafts in the home page's sample conversation, labelled as a sample. Its figures are that sample's
  (src/demo.mjs): change them together.
  Chat apps show it at about 600 x 315, half this size, so the type is large and the elements few.
  Rendered to src/assets/images/og.png by `node tools/render-images.mjs og`, which prints its size: keep it under
  300 KB, since some chat apps (WhatsApp among them, by most reports) leave larger pictures out of link previews.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OctoNeo card</title>
    <style>
      /* The site's tokens (site.css), copied: this page is rendered on its own. */
      :root {
        --bg: #0a0a0a;
        --panel: #141414;
        --line-2: rgba(255, 255, 255, 0.14);
        --text: #fafafa;
        --text-2: #a3a3a3;
        --text-3: #808080;
        --up: #42d392;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      /* Three rows: the name, the headline beside the ticket, the address. */
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 64px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, Roboto, "Noto Sans", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      /* octopus.svg is 744 x 714. */
      .brand img {
        width: 54px;
        height: 52px;
      }
      .middle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 48px;
      }
      h1 {
        font-size: 68px;
        font-weight: 500;
        line-height: 1.04;
        letter-spacing: -0.035em;
        white-space: nowrap;
      }
      .line {
        margin-top: 24px;
        color: var(--text-2);
        font-size: 28px;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .site {
        color: var(--text-3);
        font-size: 22px;
      }

      /* The ticket, drawn the way the app draws it (src/features/market/TicketCard.tsx), with fewer rows. */
      .slice {
        position: relative;
        flex: none;
        width: 400px;
      }
      .ticket {
        padding: 26px;
        border: 1px solid var(--line-2);
        border-radius: 20px;
        background: var(--panel);
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text-2);
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0;
      }
      /* Green marks the long side, as in the app: the ticket's only colour. */
      .chip-up {
        background: rgba(66, 211, 146, 0.14);
        color: var(--up);
      }
      .effect {
        margin-top: 20px;
        font-size: 17px;
        font-weight: 500;
        line-height: 1.4;
        text-wrap: balance;
      }
      .facts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 24px;
        margin-top: 18px;
        font-size: 16px;
      }
      .fact {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        white-space: nowrap;
      }
      .fact dt {
        color: var(--text-3);
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 24px;
      }
      .button {
        display: inline-flex;
        align-items: center;
        height: 44px;
        padding: 0 22px;
        border-radius: 999px;
        font-size: 17px;
        font-weight: 600;
      }
      .primary {
        background: #ffffff;
        color: var(--bg);
      }
      .ghost {
        color: var(--text-2);
      }
      /* Under the ticket, outside the row, so the ticket centres on the headline. */
      .sample {
        position: absolute;
        top: 100%;
        left: 4px;
        margin-top: 14px;
        color: var(--text-3);
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <p class="brand"><img src="../assets/images/octopus.svg" alt="" />OctoNeo</p>
    <div class="middle">
      <div>
        <h1>Ask about any market.<br />Confirm every order.</h1>
        <p class="line">Open-source AI assistant for perpetual futures</p>
      </div>
      <div class="slice">
        <div class="ticket">
          <div class="head">
            <span class="title"><span class="chip chip-up">Long</span>ETH-USDT</span>
            <span class="chip">Testnet</span>
          </div>
          <p class="effect">Opens a 7.026 ETH long at 3x with isolated margin</p>
          <dl class="facts">
            <div class="fact"><dt>Order size</dt><dd class="num">7.026 ETH</dd></div>
            <div class="fact"><dt>Leverage</dt><dd class="num">3x</dd></div>
            <div class="fact"><dt>Stop-loss</dt><dd class="num">1,764.66</dd></div>
            <div class="fact"><dt>Take-profit</dt><dd class="num">1,807.36</dd></div>
          </dl>
          <div class="actions"><span class="button primary">Place order</span><span class="button ghost">Discard</span></div>
        </div>
        <p class="sample">Sample</p>
      </div>
    </div>
    <p class="site">octoneo.xyz</p>
  </body>
</html>
