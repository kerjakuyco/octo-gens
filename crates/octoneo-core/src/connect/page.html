      const restart = el("div", { class: "actions", hidden: true }, button("Sign withdrawal again", () => prepareWithdrawal(amount, false), "quiet"));
      clock = countdown(Number(second.seconds) > 0 ? Number(second.seconds) : 45, () => {
        late.hidden = false;
        restart.hidden = false;
        say("The time is up. Decline the request in your wallet, then sign the withdrawal again.");
      });
      setState("prove", "wallet");
      fill(
        "prove",
        status("Confirm the second signature in your wallet"),
        el("p", { class: "hint", text: "Signature 2 of 2. It proves to the exchange that this request comes from you. On its own it moves nothing." }),
        clock.node,
        late,
        restart,
      );
      const two = await ask("eth_signTypedData_v4", [account, JSON.stringify(second.typedData)]);
      if (mine !== run) return;
      clock.stop();
      setState("prove", "busy");
      fill("prove", status("Sending the withdrawal to the exchange"));
      const sent = await post("/withdraw/submit", { signature: two });
      if (mine !== run) return;
      setState("prove", "done", ["Signed by", mono(short(account), account)]);
      const id = sent && (typeof sent.id === "string" || typeof sent.id === "number") ? String(sent.id) : "";
      finish(
        "ok",
        "Withdrawal requested",
        el(
          "dl",
          { class: "facts" },
          fact("Amount", `${withdraw.amount} ${asset.name}`),
          fact("Exchange fee", `${fee} ${asset.name}`),
          fact("Goes to", mono(short(account), account), " on ", chain.name),
          id ? fact("Request", mono(clip(id, 80))) : null,
        ),
        el("p", { text: "It arrives in your wallet after the exchange has processed it. Nothing more is needed from you." }),
        closing(),
      );
    } catch (error) {
      if (mine !== run) return;
      if (clock) clock.stop();
      const refused = stepNow === "prove" && isChainRefusal(error);
      const again = button("Sign withdrawal", () => prepareWithdrawal(amount, false), refused ? "quiet" : "primary");
      if (refused) {
        fail(
          "prove",
          [
            "Your wallet refused the second signature. Nothing was withdrawn.",
            "That signature is made for the exchange's own network, and this wallet signs only for the network it is on. Use a wallet that signs across networks, such as Rabby, with the same account.",
          ],
          button("Use another wallet", startOver),
          again,
        );
      } else if (isChainRefusal(error)) {
        fail("sign", `Your wallet has to be on ${chain.name} to sign this withdrawal, and it is on another network. Switch it there, then sign again. Nothing was withdrawn.`, again, withdrawAgain());
      } else if (stepNow === "prove") {
        fail("prove", `${explain(error, "Nothing was withdrawn.")} Both signatures are made again.`, again, withdrawAgain());
      } else if (fromForm && steps.get("amount").node.dataset.state !== "done") {
        withdraw.form.idle(explain(error, "Nothing was withdrawn."));
      } else {
        fail("sign", explain(error, "Nothing was withdrawn."), again, withdrawAgain());
      }
    } finally {
      land();
    }
  }

  /* ------------------------------------------------------------ the tasks */

  const SERVED = `This page is served by ${APP} from your own computer. It loads nothing from the internet.`;
  const TASKS = {
    connect: {
      title: "Approve a trading key",
      lead: `Your wallet signs one message. It lets ${APP} place and cancel perpetual futures orders on ${NETWORK} for you, and nothing else.`,
      steps: [
        ["wallet", "Connect your wallet"],
        ["network", signing ? `Switch to ${signing.name}` : "Switch network"],
        ["sign", "Sign the approval"],
      ],
      notesTitle: "Before you sign",
      notes: [
        "The trading key was made on this computer and stays in its keychain. Your wallet's own key never leaves your wallet.",
        "The approval is a signature, not a transaction. Nothing is sent on-chain and no gas is spent.",
        `The exchange takes the signature for about ${APPROVAL_SECONDS} seconds, so the wallet's prompt is timed.`,
        SERVED,
      ],
      begin: switchForApproval,
      chain: () => {
        const state = steps.get("network").node.dataset.state;
        if (signing && walletChain === signing.id && (state === "failed" || state === "skipped")) setState("network", "done", `Your wallet is on ${signing.name}`);
        if (signing && walletChain === signing.id && state === "failed") readyToSign();
      },
    },
    deposit: {
      title: "Deposit to your trading account",
      lead: "Move funds from your wallet to your trading account on the exchange. You confirm every transaction in your wallet.",
      steps: [
        ["wallet", "Connect your wallet"],
        ["amount", "Choose what to deposit"],
        ["allow", "Allow the amount"],
        ["send", "Send the deposit"],
        ["confirm", "Wait for the network"],
      ],
      notesTitle: "How a deposit works",
      notes: [
        "Funds go from your wallet, on the network you choose, to your trading account on the exchange.",
        "Your wallet may ask twice: once to allow the amount, once to send it. Both are transactions and cost that network's gas.",
        "The exchange credits a deposit after the network confirms it, usually within a few minutes.",
        SERVED,
      ],
      begin: loadDeposit,
      chain: () => {
        if (deposit.options && steps.get("amount").node.dataset.state === "active") readBalance();
      },
    },
    withdraw: {
      title: "Withdraw to your wallet",
      lead: "Move funds from your trading account on the exchange back to your own wallet. Your wallet signs twice.",
      steps: [
        ["wallet", "Connect your wallet"],
        ["amount", "Choose what to withdraw"],
        ["sign", "Sign the withdrawal"],
        ["prove", "Confirm it is you"],
      ],
      notesTitle: "How a withdrawal works",
      notes: [
        "Funds go from your trading account on the exchange to your own wallet, the one that trades. This page offers no other destination.",
        "The first signature is the withdrawal itself: amount, fee and destination. The second proves to the exchange that the request is yours.",
        `${APP}'s trading key cannot withdraw. Only your wallet's signatures can.`,
        "Both are signatures, not transactions: you pay the exchange's fee, not gas.",
        SERVED,
      ],
      begin: loadWithdraw,
    },
  };

  const TASK = TASKS[config.task];

  $("app").textContent = APP;
  $("net").replaceChildren(
    el("span", { class: "net-name", text: NETWORK }),
    config.real ? el("span", { class: "real", text: "Real funds" }) : el("span", { text: "test funds" }),
  );

  const complete = config.task === "connect" ? ADDRESS.test(config.agent || "") : ADDRESS.test(config.account || "");
  if (!TASK || !complete) {
    $("title").textContent = "Nothing to do here";
    $("lead").textContent = `This page was opened without ${TASK ? "what its task needs" : "a task"}. Start again from ${APP}.`;
    $("notes").hidden = true;
    return;
  }

  document.title = `${TASK.title} | ${APP}`;
  $("title").textContent = TASK.title;
  $("lead").textContent = TASK.lead;
  $("notes").replaceChildren(el("h2", { text: TASK.notesTitle }), el("ul", null, TASK.notes.map((text) => el("li", { text }))));
  if (config.task === "connect") showStatement();
  buildSteps(TASK.steps);
  showWallets();

  window.addEventListener("eip6963:announceProvider", (event) => addWallet(event.detail));
  window.dispatchEvent(new Event("eip6963:requestProvider"));
  // Wallets announce themselves at once; one that only sets `window.ethereum` is found a moment later.
  setTimeout(() => {
    looked = true;
    const known = wallets.length;
    legacyWallet();
    if (known === 0 && stage === "wallet" && flight === 0 && !account) showWallets();
  }, 350);
})();
</script>
</body>
</html>
