<style nonce="__NONCE__">
  /* The app's colours: paper and ink. Green and red say can and cannot, amber says real funds. */
  :root {
    color-scheme: light dark;
    --page: #f4f4f4;
    --card: #ffffff;
    --surface: #f7f7f7;
    --ink: #0d0d0d;
    --muted: #5d5d5d;
    --faint: #767676;
    --border: #e5e5e5;
    --border-strong: #cdcdcd;
    --field: #8f8f8f;
    --halo: rgba(13, 13, 13, 0.07);
    --primary: #0d0d0d;
    --primary-hover: #2f2f2f;
    --on-primary: #ffffff;
    --up: #06733b;
    --up-soft: rgba(6, 115, 59, 0.1);
    --down: #c5221f;
    --down-soft: rgba(197, 34, 31, 0.07);
    --warn: #8a5a00;
    --warn-soft: rgba(214, 150, 20, 0.15);
    --focus: #2563eb;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 12px 32px rgba(0, 0, 0, 0.06);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #181818;
      --card: #212121;
      --surface: #2a2a2a;
      --ink: #ececec;
      --muted: #b4b4b4;
      --faint: #9a9a9a;
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.2);
      --field: rgba(255, 255, 255, 0.36);
      --halo: rgba(255, 255, 255, 0.09);
      --primary: #ffffff;
      --primary-hover: #dcdcdc;
      --on-primary: #0d0d0d;
      --up: #3ecf8e;
      --up-soft: rgba(62, 207, 142, 0.13);
      --down: #ff8a80;
      --down-soft: rgba(255, 138, 128, 0.11);
      --warn: #f2b84b;
      --warn-soft: rgba(242, 184, 75, 0.13);
      --focus: #7aa7ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 16px 40px rgba(0, 0, 0, 0.32);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page);
    color: var(--ink);
    font: 400 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, p, ul, ol, dl, dd, fieldset, legend { margin: 0; padding: 0; }
  fieldset { min-width: 0; border: 0; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.9em; overflow-wrap: anywhere; }
  .quiet { color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .glyph { flex: none; width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ------------------------------------------------------------------ top */

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px clamp(16px, 4vw, 32px);
  }
  .brand { display: inline-flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
  .mark { flex: none; width: 26px; height: 24px; color: var(--ink); }
  .mark-eye { fill: var(--page); }
  .net {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 28px;
    padding: 0 11px 0 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }
  .net::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .net-name { color: var(--ink); font-weight: 600; }
  .net[data-real="true"] { border-color: transparent; background: var(--warn-soft); color: var(--warn); }
  .net[data-real="true"]::before { background: var(--warn); }
  .net[data-real="true"] .net-name { color: var(--warn); }

  /* ----------------------------------------------------------------- card */

  .page { display: grid; justify-items: center; gap: 14px; padding: clamp(4px, 3vw, 28px) 16px 56px; }
  .card {
    width: min(100%, 560px);
    padding: clamp(22px, 5vw, 34px);
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--card);
    box-shadow: var(--shadow);
  }
  h1 { font-size: clamp(23px, 4.6vw, 27px); line-height: 1.2; font-weight: 650; letter-spacing: -0.02em; text-wrap: balance; }
  .lead { margin-top: 8px; color: var(--muted); text-wrap: pretty; }

  /* ------------------------------------------------------ what will happen */

  .summary { margin-top: 22px; padding: 16px 18px 18px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .summary-title { font-size: 13px; font-weight: 600; color: var(--muted); }
  .key { display: grid; gap: 3px; margin-top: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .key-name { font-size: 13px; color: var(--muted); }
  .key .mono { font-size: 13.5px; line-height: 1.45; }
  .grants { display: grid; gap: 9px; margin-top: 14px; list-style: none; }
  .grant { display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 10px; align-items: start; }
  .grant-icon { display: grid; place-items: center; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; }
  .grant-icon .glyph { width: 12px; height: 12px; stroke-width: 2.6; }
  .grant[data-can="yes"] .grant-icon { background: var(--up-soft); color: var(--up); }
  .grant[data-can="no"] .grant-icon { background: var(--down-soft); color: var(--down); }
  .grant-word { font-weight: 650; }
  .grant[data-can="yes"] .grant-word { color: var(--up); }
  .grant[data-can="no"] .grant-word { color: var(--down); }
  .grant-strong { font-weight: 600; }
  .valid { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }

  .route { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; gap: 10px; }
  .end { display: grid; align-content: start; gap: 1px; min-width: 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--card); }
  .end-label { font-size: 12px; font-weight: 600; color: var(--muted); }
  .end-name { font-size: 15px; font-weight: 600; }
  .end-sub { font-size: 13px; color: var(--muted); }
  .route-arrow { display: grid; place-items: center; color: var(--muted); }
  .route-arrow .glyph { width: 16px; height: 16px; }
  .route-note { margin-top: 12px; font-size: 13px; color: var(--muted); }

  /* ---------------------------------------------------------------- steps */

  .steps { margin-top: 26px; list-style: none; }
  .step { position: relative; display: grid; grid-template-columns: 26px minmax(0, 1fr); column-gap: 14px; padding-bottom: 20px; }
  .step::before { content: ""; position: absolute; top: 31px; bottom: 5px; left: 12.5px; width: 1px; background: var(--border-strong); }
  .step:last-child { padding-bottom: 0; }
  .step:last-child::before { display: none; }
  .step[data-state="done"]::before, .step[data-state="skipped"]::before { background: var(--muted); }

  .marker {
    position: relative;
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    border: 1.5px solid var(--border-strong);
    border-radius: 50%;
    background: var(--card);
    color: var(--faint);
    font-size: 12px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    transition: background-color 0.2s, border-color 0.2s, color 0.2s, box-shadow 0.2s;
  }
  .step[data-state="active"] > .marker { border-color: var(--ink); color: var(--ink); box-shadow: 0 0 0 4px var(--halo); }
  .step[data-state="wallet"] > .marker, .step[data-state="busy"] > .marker { border-color: var(--border); color: var(--ink); }
  .step[data-state="wallet"] > .marker::after, .step[data-state="busy"] > .marker::after {
    content: "";
    position: absolute;
    inset: -1.5px;
    border: 2px solid transparent;
    border-top-color: var(--ink);
    border-right-color: var(--ink);
    border-radius: 50%;
    animation: turn 0.9s linear infinite;
  }
  .step[data-state="done"] > .marker { border-color: var(--primary); background: var(--primary); color: var(--on-primary); }
  .step[data-state="failed"] > .marker { border-color: var(--down); background: var(--down); color: var(--card); }
  .step[data-state="skipped"] > .marker { border-style: dashed; color: var(--muted); }
  @keyframes turn { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }

  .step-main { min-width: 0; }
  .step-title { font-size: 15.5px; line-height: 26px; font-weight: 600; }
  .step-title:focus { outline: none; }
  .step-title:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  .step[data-state="todo"] .step-title { color: var(--faint); font-weight: 500; }
  .step-summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 3px; font-size: 13.5px; color: var(--muted); }
  .step-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 12px; }
  .step-body:empty { display: none; }
  .step-body > * { min-width: 0; animation: rise 0.28s var(--ease); }

  .hint { font-size: 14px; color: var(--muted); text-wrap: pretty; }
  .plain { font-weight: 600; }
  .hush { color: var(--warn); }
  .hush:empty { display: none; }

  /* waiting for the wallet, or for the app */
  .wait { display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  .spin { width: 20px; height: 20px; margin-top: 1px; border: 2px solid var(--border-strong); border-top-color: var(--ink); border-radius: 50%; animation: turn 0.8s linear infinite; }
  .wait-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; min-width: 0; }
  .status { font-weight: 600; }

  /* something went wrong */
  .alert { display: grid; grid-template-columns: 20px minmax(0, 1fr); column-gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--down-soft); }
  .alert-icon { display: grid; place-items: center; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; background: var(--down); color: var(--card); }
  .alert-icon .glyph { width: 12px; height: 12px; stroke-width: 2.8; }
  .alert-main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; min-width: 0; }
  .problem { font-weight: 600; text-wrap: pretty; }

  .note { display: grid; grid-template-columns: 18px minmax(0, 1fr); column-gap: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 13.5px; color: var(--muted); }
  .note-icon { display: grid; place-items: center; width: 18px; height: 18px; margin-top: 1px; border: 1.5px solid currentColor; border-radius: 50%; }
  .note-icon .glyph { width: 10px; height: 10px; stroke-width: 2.6; }

  .empty { display: grid; gap: 6px; }

  /* -------------------------------------------------------------- buttons */

  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .actions > .btn { flex: 1 1 160px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 46px;
    padding: 0 20px;
    border: 1px solid transparent;
    border-radius: 12px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s, transform 0.1s;
  }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn-primary { background: var(--primary); color: var(--on-primary); }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
  .btn-quiet { border-color: var(--border-strong); background: var(--card); color: var(--ink); }
  .btn-quiet:hover:not(:disabled) { background: var(--surface); }
  .btn-small { min-height: 32px; padding: 0 12px; border-radius: 10px; font-size: 13.5px; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .link {
    padding: 0;
    border: 0;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: inherit;
    font-weight: 500;
    text-decoration: underline;
    text-decoration-color: var(--muted);
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .link:hover { text-decoration-color: currentColor; }
  .link:disabled { color: var(--faint); text-decoration: none; cursor: default; }

  /* -------------------------------------------------------------- wallets */

  .wallets { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .wallet {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    min-height: 58px;
    padding: 10px 14px;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: var(--card);
    cursor: pointer;
    transition: background-color 0.15s, border-color 0.15s;
  }
  .wallet:hover { background: var(--surface); }
  .wallet[data-on="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .wallet:has(:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  .wallet input { flex: none; width: 18px; height: 18px; margin: 0 0 0 auto; accent-color: var(--ink); }
  .wallet input:focus-visible { outline: none; }
  .wallet-icon, .wallet-letter { flex: none; width: 32px; height: 32px; border-radius: 8px; }
  .wallet-icon { object-fit: contain; }
  .wallet-letter { display: grid; place-items: center; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 650; }
  .wallet-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .chip { display: inline-flex; align-items: center; gap: 8px; min-width: 0; max-width: 100%; padding: 3px 11px 3px 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--ink); }
  .chip .wallet-icon, .chip .wallet-letter { width: 22px; height: 22px; border-radius: 999px; font-size: 11px; }
  .chip-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .chip .mono { flex: none; white-space: nowrap; color: var(--muted); }
  .copy-field { width: 100%; min-height: 40px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--card); color: var(--ink); }

  .chain { min-width: 0; }
  .chain-lead { white-space: nowrap; }
  .chain-mark { display: inline-block; width: 18px; height: 18px; margin-right: 7px; vertical-align: -4px; fill: currentColor; }
  .step-summary .chain-mark { width: 16px; height: 16px; margin-right: 5px; vertical-align: -3px; }
  .phrase { display: inline-flex; flex-wrap: wrap; align-items: center; column-gap: 0.32em; }

  /* ----------------------------------------------------------------- form */

  .form { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .field { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .btn, .hint, .status, .problem, .step-summary { overflow-wrap: anywhere; }
  .label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice {
    position: relative;
    display: inline-flex;
    align-items: center;
    min-height: 42px;
    padding: 0 14px 0 12px;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: var(--card);
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .choice input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: inherit; }
  .choice[data-on="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }
  .choice:has(:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  .form:disabled .choice, .form:disabled .link { cursor: default; }

  .amount {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 72px;
    padding: 8px 10px 8px 16px;
    border: 1px solid var(--field);
    border-radius: 14px;
    background: var(--card);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .amount:focus-within { border-color: var(--ink); box-shadow: 0 0 0 4px var(--halo); }
  .amount:has(.amount-input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  .amount[data-bad="true"] { border-color: var(--down); }
  .amount-input {
    flex: 1 1 auto;
    width: 100%;
    min-width: 0;
    padding: 0;
    border: 0;
    border-radius: 2px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: clamp(22px, 6.5vw, 34px);
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .amount-input::placeholder { color: var(--faint); opacity: 1; }
  .amount-input:focus-visible { outline: none; }
  .unit { flex: none; display: inline-flex; align-items: center; min-height: 38px; padding: 0 13px; border-radius: 999px; background: var(--surface); font-weight: 650; }
  .asset { position: relative; flex: none; display: inline-flex; align-items: center; }
  .asset select {
    appearance: none;
    -webkit-appearance: none;
    min-height: 38px;
    padding: 0 32px 0 13px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-weight: 650;
    cursor: pointer;
  }
  .asset .glyph { position: absolute; right: 11px; width: 13px; height: 13px; color: var(--muted); pointer-events: none; }
  .field-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; min-height: 30px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta > * { min-width: 0; overflow-wrap: anywhere; }
  .quick { display: inline-flex; flex-wrap: wrap; gap: 6px; }
  .pick {
    min-height: 28px;
    padding: 0 10px;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }
  .pick:not([data-on="true"]):hover:not(:disabled) { background: var(--surface); }
  .pick[data-on="true"] { border-color: var(--ink); background: var(--ink); color: var(--card); }
  .pick:disabled { opacity: 0.4; cursor: default; }
  .field-error { font-size: 13.5px; font-weight: 500; color: var(--down); }
  #amount-help[data-tone="warn"] { color: var(--warn); }
  .field-error:empty { display: none; }
  .more { display: grid; gap: 8px; }
  .aside { padding: 0 2px; font-size: 13px; color: var(--muted); }

  /* ------------------------------------------------------- figures, timer */

  .facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 0; font-size: 14px; font-variant-numeric: tabular-nums; }
  .facts dt { color: var(--muted); }
  .facts dd { min-width: 0; padding-left: 16px; overflow-wrap: anywhere; }
  .receipt { padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
  .receipt dd { text-align: right; }
  .receipt.left { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .receipt.left dd { padding-left: 0; text-align: left; }
  .receipt.left dd + dt { margin-top: 8px; }
  .facts .total { padding-top: 9px; border-top: 1px solid var(--border); color: var(--ink); font-size: 15px; font-weight: 650; }

  .clock { display: grid; gap: 6px; margin-top: 4px; }
  .clock-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .clock-track { display: block; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .clock-fill { display: block; width: 100%; height: 100%; border-radius: inherit; background: var(--ink); }
  .clock[data-low="true"] .clock-fill { background: var(--warn); }
