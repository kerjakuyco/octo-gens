  };
  function land() {
    flight = Math.max(0, flight - 1);
    if (flight === 0 && lateAccounts !== undefined) {
      const list = lateAccounts;
      lateAccounts = undefined;
      setTimeout(() => onAccounts(list), 0);
    }
  }

  async function chainNow() {
    try {
      const id = parseInt(await ask("eth_chainId"), 16);
      return Number.isFinite(id) ? id : null;
    } catch {
      return null;
    }
  }

  /** Puts the wallet on a network, adding it to the wallet first when the wallet does not know it. */
  async function ensureChain(chain) {
    if (walletChain === chain.id) return;
    try {
      await ask("wallet_switchEthereumChain", [{ chainId: chain.hex }]);
    } catch (error) {
      const unknown = codeOf(error) === 4902 || /unrecognized chain|unknown chain|not been added|add(ed)? (it|the chain|this chain)/i.test(textOf(error));
      if (!unknown) throw error;
      const explorer = typeof chain.explorer === "string" && chain.explorer.startsWith("https://") ? [chain.explorer] : null;
      const added = { chainId: chain.hex, chainName: chain.name, nativeCurrency: chain.currency, rpcUrls: chain.rpcUrls };
      if (explorer) added.blockExplorerUrls = explorer;
      await ask("wallet_addEthereumChain", [added]);
    }
    walletChain = await chainNow();
    if (walletChain !== chain.id) {
      throw new Fault(`Your wallet is still on another network. Switch it to ${chain.name}, then try again.`, "chain");
    }
  }

  const validChain = (chain) =>
    Boolean(chain) &&
    Number.isInteger(chain.id) &&
    typeof chain.hex === "string" &&
    QUANTITY.test(chain.hex) &&
    parseInt(chain.hex, 16) === chain.id &&
    typeof chain.name === "string" &&
    chain.name.length > 0 &&
    Boolean(chain.currency) &&
    Array.isArray(chain.rpcUrls);

  /* ------------------------------------------------------------ the steps */

  const STATE_WORDS = {
    todo: "not started",
    active: "current step",
    wallet: "waiting for your wallet",
    busy: "in progress",
    done: "done",
    failed: "needs attention",
    skipped: "not needed",
  };
  const steps = new Map();

  function buildSteps(list) {
    const root = $("steps");
    root.replaceChildren();
    steps.clear();
    list.forEach(([id, name], index) => {
      const marker = el("span", { class: "marker", "aria-hidden": "true" }, String(index + 1));
      const spoken = el("span", { class: "sr", text: `, ${STATE_WORDS.todo}` });
      const summary = el("p", { class: "step-summary", hidden: true });
      const body = el("div", { class: "step-body" });
      const title = el("h2", { class: "step-title", tabindex: "-1" }, name, spoken);
      const node = el("li", { class: "step", data: { state: "todo", step: id } }, marker, el("div", { class: "step-main" }, title, summary, body));
      steps.set(id, { node, marker, spoken, title, summary, body, number: index + 1 });
      root.append(node);
    });
  }

  /** Changes a step. When that removes what had the keyboard, the keyboard waits on the step's title, not on the page. */
  function keep(id, change) {
    const step = steps.get(id);
    const held = document.activeElement;
    const inside = held && held !== document.body && held !== step.title && step.node.contains(held);
    change();
    if (inside && !held.isConnected) step.title.focus({ preventScroll: true });
  }

  /** Moves the keyboard, when it waits on another step's title, to this step's. */
  function follow(id) {
    const held = document.activeElement;
    const title = steps.get(id).title;
    if (held && held !== title && held.classList.contains("step-title")) title.focus({ preventScroll: true });
  }

  function setSummary(id, content) {
    const step = steps.get(id);
    const kids = content === null || content === undefined ? [] : [content].flat().filter(Boolean);
    keep(id, () => {
      step.summary.replaceChildren(...kids);
      step.summary.hidden = kids.length === 0;
    });
  }

  /** Sets a step's state. A summary is the one line a finished step keeps. */
  function setState(id, state, summary) {
    const step = steps.get(id);
    step.node.dataset.state = state;
    step.marker.replaceChildren(
      state === "done" ? glyph("check") : state === "failed" ? glyph("bang") : state === "skipped" ? glyph("dash") : String(step.number),
    );
    step.spoken.textContent = `, ${STATE_WORDS[state]}`;
    if (state === "active" || state === "wallet" || state === "busy" || state === "failed") step.node.setAttribute("aria-current", "step");
    else step.node.removeAttribute("aria-current");
    if (summary !== undefined) setSummary(id, summary);
    if (state === "todo") setSummary(id, null);
    if (state === "todo" || state === "done" || state === "skipped") keep(id, () => step.body.replaceChildren());
  }

  function fill(id, ...kids) {
    const body = steps.get(id).body;
    keep(id, () => body.replaceChildren(...kids.flat().filter(Boolean)));
    return body;
  }

  /** Moves the keyboard to the step's first control, unless the trader is busy somewhere else. A step's title only holds it. */
  function focusIn(id) {
    const held = document.activeElement;
    if (held && held !== document.body && held.isConnected && !held.classList.contains("step-title")) return;
    const body = steps.get(id).body;
    const target = body.querySelector(".btn-primary:not(:disabled)") || body.querySelector("input:checked, input, select, button");
    if (target) target.focus({ preventScroll: true });
  }

  /**
   * Marks a step as failed. `message` is what went wrong, or that and a second, calmer paragraph.
   * When it is the page's own expiry, trying again cannot help, so no button offers it.
   */
  function fail(id, message, ...actions) {
    report(id, message, actions, false);
  }

  /** As `fail`, for an outcome to read before acting on it: the keyboard goes to the message, not to a button. */
  function failToRead(id, message, ...actions) {
    report(id, message, actions, true);
  }

  function report(id, message, actions, read) {
    const ended = expired(message);
    const [problem, more] = ended ? ["This page has expired", GONE] : [message].flat();
    const offered = ended ? [] : actions.flat().filter(Boolean);
    // With nothing to press, the message itself takes the keyboard; a message that does is not also read out as an alert.
    const toRead = read || offered.length === 0;
    say("");
    setState(id, "failed");
    const notice = trouble(problem, more, !toRead);
    fill(id, notice, offered.length ? el("div", { class: "actions" }, offered) : null);
    if (ended) expiredHere();
    if (!toRead) {
      focusIn(id);
      return;
    }
    notice.tabIndex = -1;
    const held = document.activeElement;
    if (!held || held === document.body || !held.isConnected || held.classList.contains("step-title")) notice.focus({ preventScroll: true });
  }

  /** Once the page has expired, it offers no other wallet: nothing more can happen here. */
  function expiredHere() {
    if (steps.get("wallet").node.dataset.state === "done") setSummary("wallet", walletSummary(false));
  }

  /** A timed signature ran out: say so plainly, and offer to sign again. */
  function timeUp(id, again) {
    setState(id, "failed");
    fill(id, trouble("Time is up", "Decline the request in your wallet, then sign again."), el("div", { class: "actions" }, again));
    again.focus({ preventScroll: true });
  }

  function resetWork() {
    for (const id of steps.keys()) if (id !== "wallet") setState(id, "todo");
  }

  /** A bar that runs out, for a signature the exchange only takes for a short while. */
  function countdown(seconds, onOver) {
    const bar = el("span", { class: "clock-fill" });
    const text = el("span", { class: "clock-text" });
    const node = el(
      "div",
      { class: "clock", role: "timer" },
      el("span", { class: "clock-row" }, el("span", { "aria-hidden": "true", text: "Time to sign" }), text),
      el("span", { class: "clock-track", "aria-hidden": "true" }, bar),
    );
    const total = Math.max(1, seconds) * 1000;
    const started = performance.now();
    let over = false;
    let timer = 0;
    const tick = () => {
      const left = Math.max(0, total - (performance.now() - started));
      const whole = Math.ceil(left / 1000);
      bar.style.width = `${(left / total) * 100}%`;
      text.textContent = left > 0 ? `${whole} ${whole === 1 ? "second" : "seconds"} left` : "Time is up";
      node.dataset.low = String(left > 0 && whole <= 3);
      if (left <= 0 && !over) {
        over = true;
        node.dataset.over = "true";
        clearInterval(timer);
        if (onOver) onOver();
      }
    };
    timer = setInterval(tick, 200);
    tick();
    return { node, stop: () => clearInterval(timer) };
  }

  function txLink(chain, hash) {
    const label = `${hash.slice(0, 10)}…${hash.slice(-6)}`;
    const explorer = chain && typeof chain.explorer === "string" && /^https:\/\/[^\s/]+/.test(chain.explorer) ? chain.explorer.replace(/\/+$/, "") : "";
    if (!explorer || !HASH.test(hash)) return mono(label, hash);
    return el("a", { class: "link mono", href: `${explorer}/tx/${hash}`, target: "_blank", rel: "noopener noreferrer", title: hash, "aria-label": `Transaction ${hash} (opens in a new tab)` }, label);
  }

  /** How the page ends: what happened, below the last step. */
  function finish(tone, title, ...kids) {
    stage = "final";
    setSummary("wallet", walletSummary(false));
    $("steps").dataset.ended = "true";
    const box = $("result");
    box.dataset.tone = tone;
    box.setAttribute("aria-label", title);
    box.replaceChildren(
      el("div", { class: "result-head" }, el("span", { class: "result-icon", "aria-hidden": "true" }, glyph(tone === "bad" ? "bang" : "check")), el("h2", { text: title })),
      el("div", { class: "result-body" }, kids.flat().filter(Boolean)),
    );
    box.hidden = false;
    document.title = `${title} | ${APP}`;
    box.focus({ preventScroll: true });
    box.scrollIntoView({ block: "nearest" });
  }

  const closing = () => el("p", { class: "result-close", text: `You can close this tab and return to ${APP}.` });

  /* ------------------------------------------------- step: connect wallet */

  const METAMASK_NOTE =
    "MetaMask is likely to refuse a withdrawal's second signature: it is made for the exchange's own network, and MetaMask signs only for the network it is on. A wallet that signs across networks, such as Rabby, works. You can still try; nothing is withdrawn unless both signatures are given.";

  /** The wallet's own picture when it sent one, or its first letter. */
  function walletIcon(wallet) {
    if (wallet && wallet.icon) {
      const icon = el("img", { class: "wallet-icon", alt: "" });
      icon.src = wallet.icon;
      return icon;
    }
    return el("span", { class: "wallet-letter", "aria-hidden": "true", text: wallet ? wallet.name.slice(0, 1).toUpperCase() : "?" });
  }

  function walletRow(wallet, onPick) {
    const input = el("input", { type: "radio", name: "wallet", value: wallet.key });
    input.checked = wallet.key === picked;
    input.addEventListener("change", onPick);
    return el("label", { class: "wallet", data: { on: String(input.checked), key: wallet.key } }, walletIcon(wallet), el("span", { class: "wallet-name", title: wallet.name, text: wallet.name }), input);
  }

  /** The wallet step's list. `quiet` when nothing the trader did brought it: the keyboard stays where it is. */
  function showWallets(problem = walletProblem, quiet = false) {
    walletProblem = problem;
    setState("wallet", problem ? "failed" : "active");
    if (!wallets.length) {
      if (looked) noWallet();
      else fill("wallet", status("Looking for a wallet in this browser"));
      return;
    }
    // A lone wallet is marked already. Wallets announce themselves one by one, so that is decided afresh each time.
    if (!pickedByHand || !wallets.some((wallet) => wallet.key === picked)) {
      pickedByHand = false;
      picked = wallets.length === 1 ? wallets[0].key : null;
    }
    const go = button("Connect wallet", connect);
    const caution = note(METAMASK_NOTE);
    const group = el("div", { class: "wallets", role: "radiogroup", "aria-label": "Wallet in this browser" });
    const refresh = () => {
      const on = group.querySelector("input:checked");
      picked = on ? on.value : null;
      for (const row of group.children) row.dataset.on = String(row.dataset.key === picked);
      const wallet = wallets.find((item) => item.key === picked);
      go.disabled = !wallet;
      caution.hidden = !(config.task === "withdraw" && wallet && wallet.rdns === "io.metamask");
    };
    group.append(
      ...wallets.map((wallet) =>
        walletRow(wallet, () => {
          pickedByHand = true;
          refresh();
        }),
      ),
    );
    fill(
      "wallet",
      problem ? trouble(problem) : null,
      needsAccount && ADDRESS.test(config.account || "")
        ? hint("Connect the wallet that trades, on account ", mono(short(config.account), config.account), ".")
        : wallets.length > 1
          ? hint("Choose the wallet to approve with.")
          : null,
      group,
      caution,
      el("div", { class: "actions" }, go),
    );
    refresh();
    if (!quiet) focusIn("wallet");
  }

  function noWallet() {
    const field = el("input", { class: "copy-field mono", type: "text", readonly: true, hidden: true, "aria-label": "Address of this page", value: location.href });
    const copy = button("Copy link", async () => {
      try {
        await navigator.clipboard.writeText(location.href);
        copy.textContent = "Copied";
        say("Link copied");
        setTimeout(() => {
          copy.textContent = "Copy link";
        }, 2400);
      } catch {
        field.hidden = false;
        field.focus();
        field.select();
        say("Select the address and copy it with your keyboard.");
      }
    });
    const again = button(
      "Look again",
      () => {
        lookForWallets();
        showWallets();
        if (!wallets.length) say("Still no wallet in this browser.");
        focusIn("wallet");
      },
      "quiet",
    );
    fill(
      "wallet",
      el(
        "div",
        { class: "empty" },
        el("p", { class: "plain", text: "No wallet was found in this browser." }),
        hint("Install a browser wallet such as Rabby or MetaMask, from its own website or your browser's extension store, then reload this page. If it is installed but locked, unlock it and choose Look again."),
        hint("Is your wallet in another browser? Copy this page's link and open it there. It works for a few minutes."),
      ),
      el("div", { class: "actions" }, copy, again),
      field,
    );
    say("No wallet was found in this browser.");
  }

  function walletSummary(changeable) {
    const hush = el("span", { class: "hush", role: "status" });
    const change = linkButton("Use another wallet", () => {
      if (flight > 0 || committed) {
        hush.textContent = "Answer the request in your wallet first.";
        return;
      }
      startOver();
    });
    return [
      el("span", { class: "chip" }, chosen ? walletIcon(chosen) : null, el("span", { class: "chip-name", title: chosen ? chosen.name : null, text: chosen ? chosen.name : "" }), mono(short(shown(account)), shown(account))),
      changeable ? change : null,
      changeable ? hush : null,
    ];
  }

  function startOver() {
    run += 1;
    use(null);
    account = null;
    walletChain = null;
    stage = "wallet";
    resetWork();
    setSummary("wallet", null);
    showWallets("");
  }

  async function connect() {
    const wallet = wallets.find((item) => item.key === picked);
    if (!wallet) return;
    use(wallet);
    walletProblem = "";
    const mine = ++run;
    takeoff();
    setState("wallet", "wallet");
    fill(
      "wallet",
      status("Confirm the connection in your wallet", hint(`Approve the connection in ${wallet.name}. If no prompt appears, open the wallet from the browser's toolbar.`)),
    );
    try {
      const first = preferred(await ask("eth_requestAccounts"));
      if (mine !== run) return;
      if (!first) throw new Fault("The wallet did not share an account. Unlock it, then connect again.");
      account = first;
      walletChain = await chainNow();
      if (mine !== run) return;
    } catch (error) {
      if (mine !== run) return;
      showWallets(explain(error, "Nothing was connected."));
      return;
    } finally {
      land();
    }
    entered();
  }

  /** The wallet is on an account that does not trade: say which one is needed, and follow the wallet. */
  function wrongAccount(message) {
    stage = "wallet";
    setState("wallet", "failed");
    setSummary("wallet", null);
    fill(
      "wallet",
      trouble(
        message || "Your wallet is on another account.",
        `A ${config.task === "deposit" ? "deposit" : "withdrawal"} is made by the account that trades. Switch to it in ${chosen.name}; this page follows.`,
      ),
      el("dl", { class: "facts receipt left" }, fact("Wallet is on", mono(account)), fact("Trading account", mono(config.account))),
      el("div", { class: "actions" }, button("Choose account in wallet", chooseAccount), linkButton("Use another wallet", startOver)),
    );
    focusIn("wallet");
  }

  /** The wallet has shared an account: go on, or say which account is needed. */
  function entered() {
    resetWork();
    if (needsAccount && !same(account, config.account)) {
      wrongAccount();
      return;
    }
    stage = "work";
    setState("wallet", "done", walletSummary(true));
    TASK.begin();
  }

  async function chooseAccount() {
    const mine = ++run;
    takeoff();
    setState("wallet", "wallet");
    fill("wallet", status("Choose the account in your wallet", hint("Pick the trading account, ", mono(short(config.account), config.account), `, in ${chosen.name}'s prompt.`)));
    try {
      try {
        await ask("wallet_requestPermissions", [{ eth_accounts: {} }]);
      } catch (error) {
        if (isDeclined(error)) throw error;
        // An older wallet without this request: asking for accounts again is all there is.
      }
      const next = preferred(await ask("eth_requestAccounts"));
      if (mine !== run) return;
      if (next) account = next;
    } catch (error) {
      if (mine !== run) return;
      wrongAccount(explain(error, "The wallet is still on another account."));
      return;
    } finally {
      land();
    }
    entered();
  }

  /* ------------------------------------------------------- task: connect */

  const signing = validChain(config.signingChain) ? config.signingChain : null;
  const onSigning = () => phrase("Your wallet is on", chainLabel(signing));

  async function switchForApproval() {
    if (!signing || walletChain === signing.id) {
      setState("network", "done", signing ? onSigning() : "Nothing to switch");
      readyToSign();
      return;
    }
    const mine = run;
    takeoff();
    setState("network", "wallet");
    fill(
      "network",
      status("Confirm the network switch in your wallet", hint(`The approval is signed on ${signing.name}. Your wallet asks to switch to it; nothing is sent there.`)),
    );
    try {
      await ensureChain(signing);
      if (mine !== run) return;
      setState("network", "done", onSigning());
    } catch (error) {
      if (mine !== run) return;
      if (isDeclined(error) || error instanceof Fault) {
        fail(
          "network",
          isDeclined(error) ? `You declined the network switch. The approval has to be signed on ${signing.name}.` : error.message,
          button("Switch network", switchForApproval),
        );
        return;
      }
      // Some wallets sign for a network without switching to it: go on and let the signature decide.
      setState("network", "skipped", "Your wallet does not switch on request. It may still sign.");
    } finally {
      land();
    }
    readyToSign();
  }

  function readyToSign(problem) {
    const go = button(problem ? "Try again" : "Sign approval", signApproval);
    if (problem) fail("sign", problem, go);
    else {
      setState("sign", "active");
      fill(
        "sign",
        hint(`Your wallet shows the approval for the trading key. Confirm it within ${APPROVAL_SECONDS} seconds of the prompt: after that the exchange no longer takes it, and you sign again.`),
        el("div", { class: "actions" }, go),
      );
      focusIn("sign");
    }
  }

  async function signApproval() {
    const mine = ++run;
    takeoff();
    let clock = null;
    try {
      setState("sign", "busy");
      fill("sign", status("Preparing the approval"));
      if (signing && walletChain !== signing.id) {
        try {
          await ensureChain(signing);
        } catch (error) {
          if (isDeclined(error)) throw new Fault(`You declined the network switch. The approval has to be signed on ${signing.name}.`);
        }
        if (mine !== run) return;
      }
      // The message carries the time, so it is made at the last moment.
      const prepared = await post("/prepare", { account });
      if (mine !== run) return;
      clock = countdown(Number(prepared.seconds) > 0 ? Number(prepared.seconds) : APPROVAL_SECONDS, () => timeUp("sign", button("Sign again", signApproval)));
      setState("sign", "wallet");
      fill("sign", status("Confirm the approval in your wallet", hint("Check that it names the trading key above, then sign."), clock.node));
      const signature = await ask("eth_signTypedData_v4", [account, JSON.stringify(prepared.typedData)]);
      if (mine !== run) return;
      clock.stop();
      setState("sign", "busy");
      fill("sign", status("Sending the approval to the exchange"));
      await post("/submit", { signature });
      if (mine !== run) return;
      setState("sign", "done", phrase("Signed by", mono(short(shown(account)), shown(account))));
      finish(
        "ok",
        "Approved",
        el("p", null, `${APP} can now trade perpetual futures on ${NETWORK} for `, mono(short(account), account), `, for ${days()}. It cannot withdraw.`),
        closing(),
      );
    } catch (error) {
      if (mine !== run) return;
      if (clock) clock.stop();
      readyToSign(
        isChainRefusal(error) && signing
          ? `Your wallet has to be on ${signing.name} to sign the approval, and it is on another network. Switch it there, then sign again. Nothing was approved.`
          : explain(error, "Nothing was approved."),
      );
    } finally {
      land();
    }
  }

  const days = () => {
    const count = Number(config.days);
    return Number.isFinite(count) && count > 0 ? `${count} ${count === 1 ? "day" : "days"}` : "the time you chose";
  };

  function showStatement() {
    const grant = (can, text, strong) =>
      el(
        "li",
        { class: "grant", data: { can: can ? "yes" : "no" } },
        el("span", { class: "grant-icon", "aria-hidden": "true" }, glyph(can ? "check" : "cross")),
        el("span", { class: strong ? "grant-strong" : null }, el("span", { class: "grant-word", text: can ? "Can" : "Cannot" }), ` ${text}`),
      );
    const box = $("statement");
    box.replaceChildren(
      el("h2", { class: "summary-title", id: "statement-title", text: "What your wallet approves" }),
      el("p", { class: "key" }, el("span", { class: "key-name", text: `Trading key, made by ${APP} on this computer` }), mono(String(config.agent || ""))),
      el(
        "ul",
        { class: "grants" },
        grant(true, `place and cancel perpetual futures orders on ${NETWORK}`),
        grant(false, "trade spot"),
        grant(false, "withdraw or move your funds", true),
      ),
      el("p", { class: "valid", text: `Valid for ${days()}, then it stops working by itself.` }),
    );
    box.hidden = false;
  }

  /** For a deposit or a withdrawal: where the funds come from and where they go. */
  function showRoute() {
    const deposit = config.task === "deposit";
    const end = (label, name, sub) => el("div", { class: "end" }, el("span", { class: "end-label", text: label }), el("span", { class: "end-name", text: name }), sub);
    const wallet = (label) => end(label, "Your wallet", mono(short(config.account), config.account));
    const trading = (label) => end(label, "Trading account", el("span", { class: "end-sub", text: `On the exchange, ${NETWORK}` }));
    const box = $("statement");
    box.replaceChildren(
      ...[
      el("h2", { class: "sr", id: "statement-title", text: deposit ? "Where the deposit goes" : "Where the withdrawal goes" }),
      el(
        "div",
        { class: "route" },
        deposit ? wallet("From") : trading("From"),
        el("span", { class: "route-arrow", "aria-hidden": "true" }, glyph("arrow")),
        deposit ? trading("To") : wallet("To"),
      ),
      deposit ? null : el("p", { class: "route-note", text: "Only to your own wallet, the one that trades: this page offers no other destination." }),
      ].filter(Boolean),
    );
    box.hidden = false;
  }

  /* -------------------------------------------- deposit and withdraw: form */

  function choiceGroup(legend, name, options, selected, onChange) {
    const show = (option) => (option.chain ? chainLabel(option.chain) : el("span", { text: option.label }));
    if (options.length === 1) return null;
    const rows = options.map((option) => {
      const input = el("input", { type: "radio", name, value: String(option.value) });
      input.checked = option.value === selected;
      return { input, row: el("label", { class: "choice", data: { on: String(input.checked) } }, input, show(option)) };
    });
    const group = el("fieldset", { class: "field" }, el("legend", { class: "label", text: legend }), el("div", { class: "choices" }, rows.map((item) => item.row)));
    group.addEventListener("change", () => {
      for (const item of rows) item.row.dataset.on = String(item.input.checked);
      const on = rows.find((item) => item.input.checked);
      if (on) onChange(on.input.value);
    });
    return group;
  }

  /** The asset, at the end of the amount field: a list when there is a choice. */
  function assetPicker(names, selected, onChange) {
    if (names.length === 1) return el("span", { class: "unit", text: names[0] });
    const select = el("select", { id: "asset", "aria-label": "Asset" });
    for (const name of names) {
      const option = el("option", { value: name, text: name });
      option.selected = name === selected;
      select.append(option);
    }
    select.addEventListener("change", () => onChange(select.value));
    return el("span", { class: "asset" }, select, glyph("chevron"));
  }

  /**
   * The form both money tasks share: network, one large amount with its asset, and the button.
   * `spec` supplies the lists and judges the amount; this draws them and keeps them in step.
   */
  function amountForm(spec) {
    const input = el("input", {
      class: "amount-input",
      id: "amount",
      type: "text",
      inputmode: "decimal",
      autocomplete: "off",
      spellcheck: "false",
      placeholder: "0",
      "aria-describedby": "amount-help amount-error",
      value: spec.text(),
    });
    const wrap = el("div", { class: "amount", data: { bad: "false" } }, input, assetPicker(spec.assets().map((asset) => asset.name), spec.asset().name, (value) => spec.pickAsset(value)));
    const help = el("span", { id: "amount-help" });
    const side = el("span", { class: "side" });
    const error = el("p", { class: "field-error", id: "amount-error", role: "alert" });
    const more = el("div", { class: "more" });
    const go = button(spec.verb, () => submit());
    const working = el("div", { hidden: true });
    const quick = el("span", { class: "quick-slot" });
    const set = el(
      "fieldset",
      { class: "form", "aria-label": spec.legend },
      choiceGroup("Network", "network", spec.chains().map((chain) => ({ value: chain.id, label: chain.name, chain })), spec.chain().id, (value) => spec.pickChain(Number(value))),
      el(
        "div",
        { class: "field" },
        el("div", { class: "field-head" }, el("label", { class: "label", for: "amount", text: "Amount" }), quick),
        wrap,
        el("div", { class: "meta" }, help, side),
        error,
      ),
      more,
      el("div", { class: "actions" }, go),
      working,
    );
    let formError = "";

    const put = (value) => {
      input.value = value;
      formError = "";
      refresh();
      input.focus();
    };

    /** The quick amounts: a share of what there is, and all of it. */
    const picks = (text) => {
      const list = spec.quick();
      if (!list.length) return null;
      return el(
        "span",
        { class: "quick", role: "group", "aria-label": "Quick amounts" },
        list.map((pick) =>
          el(
            "button",
            {
              type: "button",
              class: "pick",
              data: { on: String(Boolean(pick.value) && pick.value === text) },
              "aria-pressed": String(Boolean(pick.value) && pick.value === text),
              title: pick.title || null,
              "aria-label": pick.title || null,
              disabled: pick.value ? null : true,
              on: { click: () => put(pick.value) },
            },
            pick.label,
          ),
        ),
      );
    };

    const refresh = () => {
      const text = input.value.trim();
      spec.keep(text);
      const judged = spec.judge(text);
      // What went wrong with the last attempt stays in view until the amount is edited.
      const shown = formError || judged.error;
      // Only a new message is set, so the same one is not read out again at every key.
      if (error.textContent !== shown) error.textContent = shown;
      wrap.dataset.bad = String(Boolean(judged.error));
      input.setAttribute("aria-invalid", String(Boolean(judged.error)));
      go.textContent = judged.amount ? `${spec.verb} ${grouped(judged.amount)} ${spec.asset().name}` : spec.verb;
      go.disabled = !judged.amount;
      const told = spec.help(judged);
      help.textContent = typeof told === "string" ? told : told.text;
      help.dataset.tone = typeof told === "string" ? "" : told.tone;
      side.replaceChildren(...[spec.side()].filter(Boolean));
      quick.replaceChildren(...[picks(text)].filter(Boolean));
      more.replaceChildren(...[spec.more(judged)].flat().filter(Boolean));
      more.hidden = more.childElementCount === 0;
      return judged;
    };

    const submit = () => {
      const judged = refresh();
      if (!judged.amount || set.disabled) return;
      formError = "";
      error.textContent = "";
      spec.submit(judged.amount);
    };

    input.addEventListener("input", () => {
      formError = "";
      refresh();
    });
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        submit();
      }
    });
    refresh();
    return {
      node: set,
      refresh,
      /** While the page works on what was entered: nothing can be changed, and it says what it is doing. */
      busy(text) {
        const held = document.activeElement;
        const had = held && held !== document.body && set.contains(held);
        set.disabled = true;
        go.hidden = true;
        working.replaceChildren(status(text));
        working.hidden = false;
        // The form only ever stands in the amount step: its title holds the keyboard while the form is shut.
        if (had) steps.get("amount").title.focus({ preventScroll: true });
      },
      /** Back to editing, with what went wrong if something did. */
      idle(problem) {
        working.hidden = true;
        working.replaceChildren();
        if (expired(problem)) {
          // The app no longer answers: the form stays as it was, says why nothing more can happen, and takes the keyboard there.
          const notice = trouble("This page has expired", GONE, false);
          notice.tabIndex = -1;
          working.replaceChildren(notice);
          working.hidden = false;
          say("");
          expiredHere();
          notice.focus({ preventScroll: true });
          return;
        }
        set.disabled = false;
        go.hidden = false;
        formError = problem || "";
        refresh();
        if (problem) input.focus();
      },
      focus(what) {
        const target = what === "network" ? set.querySelector('input[name="network"]:checked') : what === "asset" ? set.querySelector("#asset") : input;
        (target || input).focus({ preventScroll: true });
      },
    };
  }

  /** Reads what was typed as an amount of an asset with `decimals` places. */
  function judgeAmount(text, name, decimals) {
    if (text === "") return { error: "", amount: "", units: null };
    if (!DECIMAL.test(text) || !/\d/.test(text)) return { error: "Enter a number, for example 25 or 25.5.", amount: "", units: null };
    const places = (text.split(".")[1] || "").length;
    if (places > decimals) {
      return { error: `${name} has at most ${decimals} decimal ${decimals === 1 ? "place" : "places"}.`, amount: "", units: null };
    }
    const units = toUnits(text, decimals);
    if (units === 0n) return { error: "Enter an amount above zero.", amount: "", units };
    return { error: "", amount: fromUnits(units, decimals), units };
  }

  /* ------------------------------------------------------- task: deposit */

  const deposit = { options: null, chainId: null, asset: "", text: "", balance: null, reading: "idle", reserve: 0n, form: null, look: 0, prepared: null, amount: "" };

  const depositChain = () => deposit.options.chains.find((chain) => chain.id === deposit.chainId);
  const depositAssets = () => deposit.options.assets.filter((asset) => asset.chainId === deposit.chainId);
  const depositAsset = () => depositAssets().find((asset) => asset.name === deposit.asset) || depositAssets()[0];
  const validDepositAsset = (asset) =>
    Boolean(asset) &&
    Number.isInteger(asset.chainId) &&
    typeof asset.name === "string" &&
    asset.name.length > 0 &&
    Number.isInteger(asset.decimals) &&
    asset.decimals >= 0 &&
    asset.decimals <= 36 &&
    (asset.native === true || ADDRESS.test(asset.token || ""));

  async function loadDeposit() {
    const mine = run;
    setState("amount", "busy");
    fill("amount", status("Reading what can be deposited"));
    let options;
    try {
      options = await post("/deposit/options", {});
    } catch (error) {
      if (mine !== run) return;
      fail("amount", explain(error), button("Try again", loadDeposit));
      return;
    }
    if (mine !== run) return;
    const assets = (Array.isArray(options.assets) ? options.assets : []).filter(validDepositAsset);
    const chains = (Array.isArray(options.chains) ? options.chains : []).filter((chain) => validChain(chain) && assets.some((asset) => asset.chainId === chain.id));
    if (!chains.length) {
      fail("amount", `Nothing can be deposited on ${NETWORK} right now. Try again in a while.`, button("Try again", loadDeposit));
      return;
    }
    deposit.options = { chains, assets };
    if (!chains.some((chain) => chain.id === deposit.chainId)) deposit.chainId = (chains.find((chain) => chain.id === walletChain) || chains[0]).id;
    showDepositForm("amount");
  }

  /** What the deposit will do, as it stands in the form. */
  function depositReceipt(judged) {
    const asset = depositAsset();
    const chain = depositChain();
    const coin = chain.currency && typeof chain.currency.symbol === "string" ? chain.currency.symbol : "";
    return el(
      "dl",
      { class: "facts receipt" },
      fact("Network", chainLabel(chain)),
      fact("Network fee", coin ? `Paid in ${coin} by your wallet` : "Paid by your wallet"),
      fact("Credited to", "Your trading account"),
      totalRow("You deposit", judged.amount ? `${pretty(judged.amount, asset.decimals)} ${asset.name}` : `— ${asset.name}`),
    );
  }

  function showDepositForm(focus) {
    deposit.asset = depositAsset().name;
    deposit.form = amountForm({
      verb: "Deposit",
      legend: "What to deposit",
      chains: () => deposit.options.chains,
      chain: depositChain,
      assets: depositAssets,
      asset: depositAsset,
      text: () => deposit.text,
      keep: (text) => {
        deposit.text = text;
      },
      // Picking a network asks the wallet nothing: arrowing through the list would ask at every step.
      // A wallet on another network is said under the amount, with a button to switch it.
      pickChain: (id) => {
        deposit.chainId = id;
        deposit.asset = "";
        showDepositForm("network");
      },
      pickAsset: (name) => {
        deposit.asset = name;
        showDepositForm("asset");
      },
      judge: (text) => {
        const asset = depositAsset();
        const judged = judgeAmount(text, asset.name, asset.decimals);
        if (!judged.error && judged.units !== null && deposit.balance !== null && judged.units > deposit.balance) {
          return { error: `That is more than the ${pretty(fromUnits(deposit.balance, asset.decimals))} ${asset.name} in your wallet.`, amount: "", units: judged.units };
        }
        return judged;
      },
      help: () => {
        const asset = depositAsset();
        if (deposit.reading === "elsewhere") return "Your wallet is on another network.";
        if (deposit.reading === "switching") return `Waiting for your wallet to switch to ${depositChain().name}`;
        if (deposit.reading === "reading") return "Reading your balance";
        if (deposit.reading === "unknown" || deposit.balance === null) return "Your balance could not be read. You can still enter an amount.";
        return `In your wallet: ${pretty(fromUnits(deposit.balance, asset.decimals))} ${asset.name}${asset.native ? ". Max keeps some for gas." : ""}`;
      },
      side: () => (deposit.reading === "elsewhere" ? button(`Switch to ${depositChain().name}`, switchForBalance, "quiet btn-small") : null),
      // The quick amounts wait, shown but off, until the balance can be read.
      quick: () => {
        const asset = depositAsset();
        const known = deposit.reading === "known" && deposit.balance !== null;
        const most = known ? (asset.native ? deposit.balance - deposit.reserve : deposit.balance) : 0n;
        const places = Math.min(asset.decimals, 6);
        const later = known ? "" : ", once your balance is read";
        return [
          ...[25, 50, 75].map((percent) => ({ label: `${percent}%`, value: most > 0n ? share(most, asset.decimals, percent, places) : "", title: `${percent}% of your balance${later}` })),
          { label: "Max", value: most > 0n ? fromUnits(most, asset.decimals) : "", title: `${asset.native ? "Max, less gas" : "Max"}${later}` },
        ];
      },
      more: depositReceipt,
      submit: prepareDeposit,
    });
    setState("amount", "active");
    fill("amount", deposit.form.node);
    if (focus) deposit.form.focus(focus);
    readBalance();
  }

  /** The wallet's balance of the chosen asset, read through the wallet itself. */
  async function readBalance() {
    const look = ++deposit.look;
    const asset = depositAsset();
    deposit.balance = null;
    if (walletChain !== deposit.chainId) {
      deposit.reading = "elsewhere";
      deposit.form.refresh();
      return;
    }
    deposit.reading = "reading";
    deposit.form.refresh();
    try {
      let raw;
      if (asset.native) {
        raw = await ask("eth_getBalance", [account, "latest"]);
        // Sending every last coin leaves nothing to pay for the transaction itself.
        let price = 0n;
        try {
          price = BigInt(await ask("eth_gasPrice"));
        } catch {
          price = 0n;
        }
        deposit.reserve = price > 0n ? price * 300000n : 10n ** BigInt(Math.max(0, asset.decimals - 3));
      } else {
        raw = await ask("eth_call", [{ to: asset.token, data: `0x70a08231${account.slice(2).toLowerCase().padStart(64, "0")}` }, "latest"]);
      }
      if (look !== deposit.look) return;
      deposit.balance = typeof raw === "string" && QUANTITY.test(raw) ? BigInt(raw) : 0n;
      deposit.reading = "known";
    } catch {
      if (look !== deposit.look) return;
      deposit.reading = "unknown";
    }
    deposit.form.refresh();
  }

  async function switchForBalance() {
    const mine = run;
    const chain = depositChain();
    takeoff();
    deposit.look += 1;
    deposit.reading = "switching";
    deposit.form.refresh();
    try {
      await ensureChain(chain);
    } catch (error) {
      if (mine === run) say(isDeclined(error) ? "Your wallet stayed on its network." : explain(error));
    } finally {
      land();
    }
    if (mine === run && stage === "work" && steps.get("amount").node.dataset.state === "active") readBalance();
  }

  const callOf = (value) => (value && ADDRESS.test(value.to || "") && DATA.test(value.data || "") ? { to: value.to, data: value.data } : null);

  /** Checks what the app prepared before any of it reaches the wallet. */
  function readPrepared(raw, asset) {
    const unreadable = new Fault(`${APP} prepared a deposit this page cannot read. Nothing was sent. Start again from ${APP}.`);
    const send = raw && callOf(raw.deposit);
    if (!raw || !QUANTITY.test(raw.needed || "") || !ADDRESS.test(raw.vault || "") || !send || !same(send.to, raw.vault)) throw unreadable;
    if (raw.deposit.value !== undefined && raw.deposit.value !== null && !QUANTITY.test(raw.deposit.value)) throw unreadable;
    const prepared = { needed: BigInt(raw.needed), vault: raw.vault, send: { ...send, value: raw.deposit.value || "0x0" } };
    // The network's own coin travels with the transaction; a token never does.
    if (BigInt(prepared.send.value) !== (asset.native ? prepared.needed : 0n)) throw unreadable;
    for (const name of ["balance", "allowance", "approve", "reset"]) {
      prepared[name] = null;
      if (raw[name] === null || raw[name] === undefined) continue;
      const call = callOf(raw[name]);
      // Every token call goes to the token that was chosen, and nowhere else.
      if (!call || asset.native || !same(call.to, asset.token)) throw unreadable;
      prepared[name] = call;
    }
    return prepared;
  }

  const depositLine = () => phrase(`${deposit.amount} ${deposit.asset} from`, chainLabel(depositChain()));
  const changeAmount = () =>
    linkButton("Change the amount", () => {
      if (flight > 0 || committed) return;
      run += 1;
      for (const id of ["allow", "send", "confirm"]) setState(id, "todo");
      setSummary("amount", null);
      showDepositForm("amount");
    });

  async function prepareDeposit(amount) {
    const mine = run;
    const asset = depositAsset();
    const chain = depositChain();
    takeoff();
    deposit.form.busy("Preparing the deposit");
    try {
      await ensureChain(chain);
      if (mine !== run) return;
      const raw = await post("/deposit/prepare", { account, chainId: chain.id, asset: asset.name, amount });
      if (mine !== run) return;
      const prepared = readPrepared(raw, asset);
      const held = prepared.balance ? await ask("eth_call", [prepared.balance, "latest"]) : await ask("eth_getBalance", [account, "latest"]);
      if (mine !== run) return;
      const balance = typeof held === "string" && QUANTITY.test(held) ? BigInt(held) : 0n;
      if (balance < prepared.needed) {
        deposit.balance = balance;
        deposit.reading = "known";
        deposit.form.idle(`Your wallet holds ${pretty(fromUnits(balance, asset.decimals))} ${asset.name} on ${chain.name}, less than the ${amount} you entered.`);
        return;
      }
      deposit.prepared = prepared;
      deposit.amount = typeof raw.amount === "string" && isDecimal(raw.amount) ? raw.amount : amount;
    } catch (error) {
      if (mine !== run) return;
      deposit.form.idle(explain(error, "Nothing was sent."));
      return;
    } finally {
      land();
    }
    setState("amount", "done", depositLine());
    allowDeposit();
  }

  /** Waits until the network has taken a transaction in. `true` when it succeeded. */
  async function confirmed(hash, mine, onSlow) {
    const started = Date.now();
    let misses = 0;
    let told = false;
    await sleep(1200);
    for (;;) {
      if (mine !== run) throw new Fault("", "abandoned");
      try {
        const receipt = await ask("eth_getTransactionReceipt", [hash]);
        misses = 0;
        if (receipt && receipt.status !== undefined && receipt.status !== null) {
          return receipt.status === "0x1" || receipt.status === 1 || receipt.status === true;
        }
        if (receipt && receipt.blockNumber) return true;
      } catch {
        misses += 1;
        if (misses >= 6) throw new Fault("Your wallet does not say whether the transaction was confirmed. Follow it in the network's explorer.", "blind");
      }
      if (!told && onSlow && Date.now() - started > 90000) {
        told = true;
        onSlow();
      }
      await sleep(POLL_MS);
    }
  }

  /** One transaction of a step: the wallet's prompt, then the wait for the network. */
  async function transact(id, call, title, prompt, mine) {
    const chain = depositChain();
    setState(id, "wallet");
    fill(id, status(title, hint(prompt)));
    const hash = await ask("eth_sendTransaction", [{ from: account, to: call.to, data: call.data, value: call.value || "0x0" }]);
    if (typeof hash !== "string" || !HASH.test(hash)) throw new Fault("The wallet did not say which transaction it sent. Check the wallet's activity before trying again.");
    if (mine !== run) throw new Fault("", "abandoned");
    setState(id, "busy");
    const slow = hint("The network is taking longer than usual. The transaction is still on its way.");
    slow.hidden = true;
    fill(id, status("Waiting for the network to confirm", hint("Transaction ", txLink(chain, hash)), slow));
    const ok = await confirmed(hash, mine, () => {
      slow.hidden = false;
    });
    return { hash, ok };
  }

  async function allowDeposit() {
    const mine = run;
    const prepared = deposit.prepared;
    const asset = depositAsset();
    const chain = depositChain();
    if (!prepared.allowance || !prepared.approve) {
      setState("allow", "skipped", asset.native ? `Not needed for ${asset.name}` : "Not needed");
      sendDeposit();
      return;
    }
    takeoff();
    try {
      setState("allow", "busy");
      fill("allow", status("Checking what the deposit contract may already take"));
      const raw = await ask("eth_call", [prepared.allowance, "latest"]);
      if (mine !== run) return;
      const allowed = typeof raw === "string" && QUANTITY.test(raw) ? BigInt(raw) : 0n;
      if (allowed >= prepared.needed) {
        setState("allow", "skipped", "Already allowed");
      } else {
        if (allowed > 0n && prepared.reset) {
          const cleared = await transact(
            "allow",
            prepared.reset,
            "Confirm the allowance in your wallet",
            `First your wallet clears the old allowance for ${asset.name}. This token has to be set to zero before the amount can change. It is one more transaction.`,
            mine,
          );
          if (!cleared.ok) throw new Fault("Clearing the old allowance failed on the network. Nothing was allowed; the network kept the gas.");
        }
        const done = await transact(
          "allow",
          prepared.approve,
          "Confirm the allowance in your wallet",
          `Confirm the allowance in your wallet. It lets the exchange's deposit contract (${short(prepared.vault)}) take ${deposit.amount} ${asset.name}, and no more.`,
          mine,
        );
        if (!done.ok) throw new Fault("The allowance failed on the network. Nothing was allowed; the network kept the gas.");
        setState("allow", "done", phrase("Transaction", txLink(chain, done.hash)));
      }
    } catch (error) {
      if (mine !== run || error.kind === "abandoned") return;
      fail("allow", explain(error, "Nothing was allowed."), button("Try again", allowDeposit), changeAmount());
      return;
    } finally {
      land();
    }
    sendDeposit();
  }

  async function sendDeposit() {
    const mine = run;
    const prepared = deposit.prepared;
    const asset = depositAsset();
    const chain = depositChain();
    let hash;
    takeoff();
    try {
      setState("send", "wallet");
      fill(
        "send",
        status("Confirm the deposit in your wallet", hint(`Confirm the deposit in your wallet: ${deposit.amount} ${asset.name} to the exchange's deposit contract (${short(prepared.vault)}).`)),
      );
      hash = await ask("eth_sendTransaction", [{ from: account, to: prepared.send.to, data: prepared.send.data, value: prepared.send.value }]);
      if (typeof hash !== "string" || !HASH.test(hash)) throw new Fault("The wallet did not say which transaction it sent. Check the wallet's activity before trying again.");
    } catch (error) {
      land();
      if (mine !== run) return;
      fail("send", explain(error, "Nothing was deposited."), button("Try again", sendDeposit), changeAmount());
      return;
    }
    // From here the deposit is on its way: nothing on this page may start it again.
    committed = true;
    setSummary("wallet", walletSummary(false));
    setState("send", "done", phrase("Transaction", txLink(chain, hash)));
    let told = true;
    try {
      await post("/deposit/sent", { hash });
    } catch {
      told = false;
    }
    setState("confirm", "busy");
    const slow = hint("The network is taking longer than usual. The deposit is still on its way.");
    slow.hidden = true;
    fill("confirm", status("Waiting for the network to confirm the deposit", hint("Usually under a minute. You can leave this tab open meanwhile."), slow));
    let ok = null;
    try {
      ok = await confirmed(hash, mine, () => {
        slow.hidden = false;
      });
    } catch {
      ok = null;
    }
    if (ok !== null) {
      try {
        await post("/deposit/confirmed", { hash, ok });
      } catch {
        told = false;
      }
    }
    land();
    const unheard = told ? null : hint(`${APP} could not be told, because this page had expired. The transaction is what counts: the app shows the funds once the exchange credits them.`);
    const receipt = el(
      "dl",
      { class: "facts receipt" },
      fact("Amount", `${deposit.amount} ${asset.name}`),
      fact("Network", chainLabel(chain)),
      fact("Transaction", txLink(chain, hash)),
    );
    if (ok === true) {
      setState("confirm", "done", "Confirmed by the network");
      finish("ok", "Deposit confirmed", receipt, el("p", { text: `The exchange credits your trading account next, usually within a few minutes. ${APP} shows the funds once it has.` }), unheard, closing());
    } else if (ok === false) {
      setState("confirm", "failed", "Failed on the network");
      fill("confirm");
      finish("bad", "The deposit failed on the network", receipt, el("p", { text: `Nothing was deposited, and the network kept the gas. The transaction's page says why. To try again, start a new deposit from ${APP}.` }), unheard);
    } else {
      setState("confirm", "skipped", "Not reported by the wallet");
      finish("plain", "Deposit sent", receipt, el("p", { text: "Your wallet does not say whether it was confirmed. Follow the transaction in the network's explorer; the exchange credits it once the network confirms it." }), unheard, closing());
    }
  }

  /* ------------------------------------------------------ task: withdraw */

  const withdraw = { options: null, chainId: null, asset: "", text: "", form: null, amount: "" };

  const withdrawChain = () => withdraw.options.chains.find((chain) => chain.id === withdraw.chainId);
  const withdrawAssets = () => withdraw.options.assets.filter((asset) => asset.chainId === withdraw.chainId);
  const withdrawAsset = () => withdrawAssets().find((asset) => asset.name === withdraw.asset) || withdrawAssets()[0];
  /** The exchange keeps eight decimal places unless it says otherwise. */
  const placesOf = (asset) => (Number.isInteger(asset.decimals) && asset.decimals >= 0 && asset.decimals <= 18 ? asset.decimals : 8);

  async function loadWithdraw() {
    const mine = run;
    setState("amount", "busy");
    fill("amount", status("Reading what can be withdrawn"));
    let options;
    try {
      options = await post("/withdraw/options", {});
    } catch (error) {
      if (mine !== run) return;
      fail("amount", explain(error), button("Try again", loadWithdraw));
      return;
    }
    if (mine !== run) return;
    const assets = (Array.isArray(options.assets) ? options.assets : []).filter(
      (asset) => asset && Number.isInteger(asset.chainId) && typeof asset.name === "string" && asset.name && isDecimal(asset.max) && isDecimal(asset.fee) && toUnits(asset.max, 18) !== 0n,
    );
    const chains = (Array.isArray(options.chains) ? options.chains : []).filter((chain) => validChain(chain) && assets.some((asset) => asset.chainId === chain.id));
    if (!chains.length) {
      setState("amount", "active");
      fill(
        "amount",
        el(
          "div",
          { class: "empty" },
          el("p", { class: "plain", text: "There is nothing to withdraw yet." }),
          hint("Funds that back open positions and orders stay on the exchange until those are closed. A deposit also needs a few minutes before it can leave again."),
        ),
        el("div", { class: "actions" }, button("Check again", loadWithdraw)),
      );
      focusIn("amount");
      return;
    }
    const daily = options.daily && isDecimal(options.daily.limit) && isDecimal(options.daily.left) ? options.daily : null;
    withdraw.options = { chains, assets, daily };
    if (!chains.some((chain) => chain.id === withdraw.chainId)) withdraw.chainId = (chains.find((chain) => chain.id === walletChain) || chains[0]).id;
    showWithdrawForm("amount");
  }

  /** What the withdrawal will do, as it stands in the form. The fee is fixed when the wallet signs, so these are close figures. */
  function withdrawReceipt(judged) {
    const asset = withdrawAsset();
    const daily = withdraw.options.daily;
    const rest = judged.amount ? minus(judged.amount, asset.fee) : null;
    const receive = rest ? `about ${pretty(rest, 8)} ${asset.name}` : judged.amount ? "Less than the fee" : `— ${asset.name}`;
    return [
      el(
        "dl",
        { class: "facts receipt" },
        fact("Network", chainLabel(withdrawChain())),
        fact("Goes to", mono(short(shown(account)), shown(account)), el("span", { class: "quiet", text: ", your wallet" })),
        fact("Exchange fee", `about ${pretty(asset.fee, 8)} ${asset.name}`),
        totalRow("You receive", receive),
      ),
      daily ? el("p", { class: "aside", text: `Daily limit: ${pretty(daily.left, 2)} of ${pretty(daily.limit, 2)} USD left.` }) : null,
    ];
  }

  function showWithdrawForm(focus) {
    withdraw.asset = withdrawAsset().name;
    withdraw.form = amountForm({
      verb: "Withdraw",
      legend: "What to withdraw",
      chains: () => withdraw.options.chains,
      chain: withdrawChain,
      assets: withdrawAssets,
      asset: withdrawAsset,
      text: () => withdraw.text,
      keep: (text) => {
        withdraw.text = text;
      },
      pickChain: (id) => {
        withdraw.chainId = id;
        withdraw.asset = "";
        showWithdrawForm("network");
      },
      pickAsset: (name) => {
        withdraw.asset = name;
        showWithdrawForm("asset");
      },
      judge: (text) => {
        const asset = withdrawAsset();
        const judged = judgeAmount(text, asset.name, placesOf(asset));
        const most = toUnits(asset.max, 18);
        const asked = judged.error || judged.units === null ? null : toUnits(text, 18);
        if (asked !== null && most !== null && asked > most) {
          return { error: `That is more than the ${pretty(asset.max, 8)} ${asset.name} you can withdraw to ${withdrawChain().name} now.`, amount: "", units: judged.units };
        }
        return judged;
      },
      // At or below the fee is said before the click; the app still decides, since the fee is only fixed at signing.
      help: (judged) => {
        const asset = withdrawAsset();
        if (judged.amount && !minus(judged.amount, asset.fee)) return { text: `Less than the exchange's fee of about ${pretty(asset.fee, 8)} ${asset.name}`, tone: "warn" };
        return `You can withdraw ${pretty(asset.max, 8)} ${asset.name}`;
      },
      side: () => null,
      quick: () => {
        const asset = withdrawAsset();
        const most = toUnits(cut(asset.max, 18), 18);
        if (most === null || most <= 0n) return [];
        const places = Math.min(placesOf(asset), 6);
        return [
          ...[25, 50, 75].map((percent) => ({ label: `${percent}%`, value: share(most, 18, percent, places), title: `${percent}% of what you can withdraw` })),
          { label: "Max", value: cut(asset.max, placesOf(asset)), title: "Max" },
        ];
      },
      more: withdrawReceipt,
      submit: (amount) => prepareWithdrawal(amount, true),
    });
    setState("amount", "active");
    fill("amount", chosen && chosen.rdns === "io.metamask" ? note(METAMASK_NOTE) : null, withdraw.form.node);
    if (focus) withdraw.form.focus(focus);
  }

  const withdrawAgain = () =>
    linkButton("Change the amount", () => {
      if (flight > 0) return;
      run += 1;
      for (const id of ["sign", "prove"]) setState(id, "todo");
      setSummary("amount", null);
      showWithdrawForm("amount");
    });

  /** Both signatures, from the start: the exchange ties the second to a fresh first. */
  async function prepareWithdrawal(amount, fromForm) {
    const mine = fromForm ? run : ++run;
    const asset = withdrawAsset();
    const chain = withdrawChain();
    let stepNow = "sign";
    let clock = null;
    takeoff();
    try {
      if (fromForm) withdraw.form.busy("Preparing the withdrawal");
      else {
        setState("prove", "todo");
        setState("sign", "busy");
        fill("sign", status("Preparing the withdrawal"));
        follow("sign");
      }
      try {
        await ensureChain(chain);
      } catch (error) {
        // A wallet that cannot switch may still sign for that network. One that was told no has to be asked again.
        if (isDeclined(error)) throw new Fault(`You declined the network switch. The withdrawal is signed on ${chain.name}. Nothing was withdrawn.`);
      }
      if (mine !== run) return;
      const first = await post("/withdraw/prepare", { account, chainId: chain.id, asset: asset.name, amount });
      if (mine !== run) return;
      const message = first && first.typedData && first.typedData.message;
      if (!first || !first.typedData || !same(first.receiver, account) || (message && typeof message.destination === "string" && !same(message.destination, account))) {
        throw new Fault(`${APP} prepared a withdrawal that does not go to your wallet. Nothing was signed. Start again from ${APP}.`);
      }
      withdraw.amount = isDecimal(first.amount) ? first.amount : amount;
      const fee = isDecimal(first.fee) ? first.fee : asset.fee;
      const rest = minus(withdraw.amount, fee);
      const figures = (request) =>
        el(
          "dl",
          { class: "facts receipt" },
          fact("Amount", `${withdraw.amount} ${asset.name}`),
          fact("Exchange fee", `${fee} ${asset.name}`),
          fact("Goes to", mono(short(shown(account)), shown(account)), el("span", { class: "quiet", text: ", your wallet" })),
          fact("Network", chainLabel(chain)),
          request ? fact("Request", mono(clip(request, 80))) : null,
          rest ? totalRow("You receive", `${rest} ${asset.name}`) : null,
        );
      setState("amount", "done", phrase(`${withdraw.amount} ${asset.name} to`, chainLabel(chain)));

      setState("sign", "wallet");
      fill(
        "sign",
        status("Confirm the withdrawal in your wallet", hint("Signature 1 of 2. Your wallet shows the amount, the fee and where it goes: check them there before you sign.")),
        figures(),
      );
      const one = await ask("eth_signTypedData_v4", [account, JSON.stringify(first.typedData)]);
      if (mine !== run) return;
      setState("sign", "busy");
      fill("sign", status("Checking the signature"));
      const second = await post("/withdraw/signed", { signature: one });
      if (mine !== run) return;
      setState("sign", "done", phrase("Signed by", mono(short(shown(account)), shown(account))));

      stepNow = "prove";
      const seconds = Number(second.seconds) > 0 ? Number(second.seconds) : 45;
      clock = countdown(seconds, () => timeUp("prove", button("Sign again", () => prepareWithdrawal(amount, false))));
      setState("prove", "wallet");
      fill(
        "prove",
        status(
          `Confirm it is you: sign in your wallet within ${seconds} seconds`,
          hint("Signature 2 of 2. It proves to the exchange that this request comes from you. On its own it moves nothing."),
          clock.node,
        ),
      );
      const two = await ask("eth_signTypedData_v4", [account, JSON.stringify(second.typedData)]);
      if (mine !== run) return;
      clock.stop();
      setState("prove", "busy");
      fill("prove", status("Sending the withdrawal to the exchange"));
      const sent = await post("/withdraw/submit", { signature: two });
      if (mine !== run) return;
      setState("prove", "done", phrase("Signed by", mono(short(shown(account)), shown(account))));
      const id = sent && (typeof sent.id === "string" || typeof sent.id === "number") ? String(sent.id) : "";
      finish(
        "ok",
        "Withdrawal requested",
        figures(id),
        el("p", { text: "It arrives in your wallet after the exchange has processed it. Nothing more is needed from you." }),
        closing(),
      );
    } catch (error) {
      if (mine !== run) return;
      if (clock) clock.stop();
      const refused = stepNow === "prove" && isChainRefusal(error);
      // Past the first signature, asking again makes a new withdrawal with new signatures; the last one may yet have gone through.
      const again =
        stepNow === "prove"
          ? button("Sign a new withdrawal", () => prepareWithdrawal(amount, false), "quiet")
          : button("Try again", () => prepareWithdrawal(amount, false));
      if (refused) {
        failToRead(
          "prove",
          [
            "Your wallet refused the second signature. Nothing was withdrawn.",
            "That signature is made for the exchange's own network, and this wallet signs only for the network it is on. Use a wallet that signs across networks, such as Rabby, with the same account.",
          ],
          button("Use another wallet", startOver),
          again,
        );
      } else if (isChainRefusal(error)) {
        fail("sign", `Your wallet has to be on ${chain.name} to sign this withdrawal, and it is on another network. Switch it there, then sign again. Nothing was withdrawn.`, again, withdrawAgain());
      } else if (stepNow === "prove") {
        failToRead("prove", `${explain(error, "Nothing was withdrawn.")} Both signatures are made again.`, again, withdrawAgain());
      } else if (fromForm && steps.get("amount").node.dataset.state !== "done") {
        withdraw.form.idle(explain(error, "Nothing was withdrawn."));
      } else {
        fail("sign", explain(error, "Nothing was withdrawn."), again, withdrawAgain());
      }
    } finally {
      land();
    }
  }

  /* ------------------------------------------------------------ the tasks */

  const SERVED = `Served by ${APP} from your own computer. It loads nothing from the internet.`;
  const TASKS = {
    connect: {
      title: "Approve a trading key",
      lead: `Your wallet signs one message. It lets ${APP} place and cancel perpetual futures orders on ${NETWORK} for you, and nothing else.`,
      steps: [
        ["wallet", "Connect your wallet"],
        ["network", signing ? `Switch to ${signing.name}` : "Switch network"],
        ["sign", "Sign the approval"],
      ],
      notesTitle: "Before you sign",
      notes: [
        "The trading key was made on this computer and stays in its keychain. Your wallet's own key never leaves your wallet.",
        "The approval is a signature, not a transaction. Nothing is sent on-chain and no gas is spent.",
        `The exchange takes the signature for about ${APPROVAL_SECONDS} seconds, so the wallet's prompt is timed.`,
      ],
      begin: switchForApproval,
      chain: () => {
        const state = steps.get("network").node.dataset.state;
        if (signing && walletChain === signing.id && (state === "failed" || state === "skipped")) setState("network", "done", onSigning());
        if (signing && walletChain === signing.id && state === "failed") readyToSign();
      },
    },
    deposit: {
      title: "Deposit to your trading account",
      lead: "Move funds from your wallet to your trading account on the exchange. You confirm every transaction in your wallet.",
      steps: [
        ["wallet", "Connect your wallet"],
        ["amount", "Choose what to deposit"],
        ["allow", "Allow the amount"],
        ["send", "Send the deposit"],
        ["confirm", "Wait for the network"],
      ],
      notesTitle: "How a deposit works",
      notes: [
        "Funds go from your wallet, on the network you choose, to your trading account on the exchange.",
        "Your wallet may ask twice: once to allow the amount, once to send it. Both are transactions and cost that network's gas.",
        "The exchange credits a deposit after the network confirms it, usually within a few minutes.",
      ],
      begin: loadDeposit,
      chain: () => {
        if (deposit.options && steps.get("amount").node.dataset.state === "active") readBalance();
      },
    },
    withdraw: {
      title: "Withdraw to your wallet",
      lead: "Move funds from your trading account on the exchange back to your own wallet. Your wallet signs twice.",
      steps: [
        ["wallet", "Connect your wallet"],
        ["amount", "Choose what to withdraw"],
        ["sign", "Sign the withdrawal"],
        ["prove", "Confirm it is you"],
      ],
      notesTitle: "How a withdrawal works",
      notes: [
        "Funds go from your trading account on the exchange to your own wallet, the one that trades. This page offers no other destination.",
        "The first signature is the withdrawal itself: amount, fee and destination. The second proves to the exchange that the request is yours.",
        `${APP}'s trading key cannot withdraw. Only your wallet's signatures can.`,
        "Both are signatures, not transactions: you pay the exchange's fee, not gas.",
      ],
      begin: loadWithdraw,
    },
  };

  const TASK = TASKS[config.task];

  $("app").textContent = APP;
  const net = $("net");
  net.dataset.real = String(Boolean(config.real));
  net.replaceChildren(
    el("span", { class: "net-name", text: NETWORK }),
    el("span", { "aria-hidden": "true", text: "·" }),
    el("span", { text: config.real ? "real funds" : "test funds" }),
  );
  $("served").replaceChildren(glyph("lock"), SERVED);

  const complete = config.task === "connect" ? ADDRESS.test(config.agent || "") : ADDRESS.test(config.account || "");
  if (!TASK || !complete) {
    $("title").textContent = "Nothing to do here";
    $("lead").textContent = `This page was opened without ${TASK ? "what its task needs" : "a task"}. Start again from ${APP}.`;
    $("notes").hidden = true;
    return;
  }

  document.title = `${TASK.title} | ${APP}`;
  $("title").textContent = TASK.title;
  $("lead").textContent = TASK.lead;
  $("notes").replaceChildren(el("summary", null, glyph("more"), el("span", { text: TASK.notesTitle })), el("ul", null, TASK.notes.map((text) => el("li", { text }))));
  if (config.task === "connect") showStatement();
  else showRoute();
  buildSteps(TASK.steps);
  showWallets("", true);

  window.addEventListener("eip6963:announceProvider", (event) => addWallet(event.detail));
  window.dispatchEvent(new Event("eip6963:requestProvider"));
  // Wallets announce themselves at once; one that only sets `window.ethereum` is found a moment later.
  setTimeout(() => {
    looked = true;
    const known = wallets.length;
    legacyWallet();
    if (known === 0 && stage === "wallet" && flight === 0 && !account) showWallets(walletProblem, true);
  }, 350);
})();
</script>
</body>
</html>
