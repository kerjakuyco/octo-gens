name: Bug report
description: Something does not work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never paste private keys, seed phrases or API keys.** Wallet addresses are public, but redact them if you prefer.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Switch to Testnet
        2. Ask "Long 0.01 BTC with a stop at 60000"
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OctoNeo version
      description: Shown in Settings under About.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Operating system
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [Mainnet, Testnet, Both, Not relevant]
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: For assistant problems. The provider and the model, for example "OpenRouter, openai/gpt-4.1" or "Ollama, qwen3:8b".
  - type: textarea
    id: details
    attributes:
      label: Error text or run trace
      description: The message the app showed, or the steps from the run in Activity. Remove anything private.
      render: text
