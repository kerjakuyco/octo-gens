name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # The stdio MCP transport is tested against a real child process started with Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Installs the toolchain named in rust-toolchain.toml.
      - run: rustup show
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy -p octoneo-core --all-targets -- -D warnings
      - name: Test
        run: cargo test -p octoneo-core

  interface:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # pnpm comes from the `packageManager` field in package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: node --test scripts/updater-manifest.test.mjs
      - run: pnpm build

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
      # pnpm comes from the `packageManager` field in site/package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Builds every page, then checks links, assets, titles, the content policy and that the exchange is not named.
      - run: pnpm run check
      # Proves the Cloudflare Worker configuration is valid, without logging in or deploying.
      - run: pnpm exec wrangler deploy --dry-run

  app:
    name: App (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: rustup show
      # A debug build with the interface bundled in, as the smoke test needs.
      - run: pnpm tauri build --debug --no-bundle
      - name: Lint the shell
        run: cargo clippy -p octoneo-desktop --all-targets -- -D warnings
      # Runs the real window against stand-ins for the exchange and for a model: types a message, lets the
      # model draft a ticket, confirms it, and checks that the signed order and its stop arrived.
      - name: Smoke test
        if: runner.os != 'Linux'
        run: pnpm smoke
      - name: Smoke test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm smoke
