name: Native desktop installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: bdist_msi
            artifact: windows-x64
            files: dist/*.msi
          - os: macos-15
            command: bdist_dmg
            artifact: macos-arm64
            files: build/*.dmg
          - os: macos-15-intel
            command: bdist_dmg
            artifact: macos-x64
            files: build/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: cxfreeze ${{ matrix.command }}
      - run: python tools/smoke_binary.py
      - uses: actions/upload-artifact@v4
        with:
          name: octo-gens-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
