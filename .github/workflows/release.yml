name: Release

# Builds installers for every platform and attaches them to a draft release.
# Push a tag such as v0.3.0, review the draft on GitHub, then publish it.
#
# The installers are not signed with a developer certificate or notarized:
# that needs certificates this repository does not hold. macOS builds are
# sealed with an ad-hoc signature only. See SECURITY.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Octo Gens ${GITHUB_REF_NAME#v}"

  bundle:
    name: Installers (${{ matrix.name }})
    needs: draft
    if: always() && (needs.draft.result == 'success' || needs.draft.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
          - name: macos-x64
            os: macos-15-intel
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: rustup show
      - run: cargo test -p octogens-core
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: octo-gens-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
      - name: Attach installers to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(target/release/bundle/dmg/*.dmg target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
