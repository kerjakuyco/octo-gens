[workspace]
resolver = "3"
members = ["crates/octoneo-core", "src-tauri"]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/kerjakuyco/octo-neo"
authors = ["OctoNeo contributors"]
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "net"] }
tokio-util = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Size-focused release build: https://tauri.app/concept/size/#cargo-configuration
# Panics unwind rather than abort. A fault in one task (a tool call, a refresh) must
# not stop the process while another task is placing an order and its stop-loss.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
